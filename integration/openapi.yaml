openapi: 3.1.0
info:
  title: Evolution Engine ↔ micro-store-template contract
  version: 1.0.0
  description: |
    HTTP surface that the evolution-engine (a.k.a. store generator) must
    implement so the hourly-store workflow in
    `Full-Stack-Assets/micro-store-template` can pull brand data and
    report back deployed previews.

    The source of truth for the `BrandData` payload is
    [`schema/brand-data.schema.json`](../schema/brand-data.schema.json).
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: https://engine.example.com
        description: Value of the `EVOLUTION_ENGINE_URL` secret in the storefront repo.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token issued by the engine; stored as `EVOLUTION_ENGINE_TOKEN`.

  schemas:
    ColorPalette:
      type: object
      additionalProperties: false
      required: [primary, secondary]
      properties:
        primary:
          type: string
          pattern: '^#([0-9a-fA-F]{3}){1,2}$'
          example: "#0f172a"
        secondary:
          type: string
          pattern: '^#([0-9a-fA-F]{3}){1,2}$'
          example: "#f97316"

    BrandData:
      type: object
      additionalProperties: false
      required: [brandName, tagline, colorPalette]
      properties:
        brandName:
          type: string
          minLength: 1
          example: Driftwood Coffee
        tagline:
          type: string
          minLength: 1
          example: Brewed slow, poured bold.
        logoUrl:
          type: string
          pattern: '^https?://'
          example: https://cdn.example.com/logo.png
        heroImageUrl:
          type: string
          pattern: '^https?://'
          example: https://cdn.example.com/hero.png
        colorPalette:
          $ref: '#/components/schemas/ColorPalette'

    DeploymentReport:
      type: object
      additionalProperties: false
      required: [url, sha, run_id, ran_at]
      properties:
        url:
          type: string
          pattern: '^https://'
          description: Vercel preview URL returned by `vercel deploy`.
          example: https://micro-store-template-abc123.vercel.app
        sha:
          type: string
          description: Commit SHA the workflow ran against.
          example: a2053199ac9edcbf10493976e7e5752534143c7e
        run_id:
          type: string
          description: GitHub Actions run ID for cross-reference.
          example: "12345678901"
        ran_at:
          type: string
          format: date-time
          example: "2026-06-07T08:50:03Z"

security:
  - bearerAuth: []

paths:
  /brand:
    get:
      operationId: getBrand
      summary: Generate a new brand for the next hourly store.
      description: |
        Called once per workflow run (hourly cron, manual dispatch, or
        immediately after a `repository_dispatch` that did *not* include
        a `client_payload.brand_data` override).

        Implementations are expected to be **non-idempotent** — each call
        returns a fresh, generated brand. Engines that want to replay
        should expose a separate endpoint.
      responses:
        '200':
          description: A `BrandData` payload conforming to the JSON schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandData'
        '401':
          description: Missing or invalid bearer token.
        '5XX':
          description: Engine-side failure. The workflow fails the run and skips deploy.

  /deployments:
    post:
      operationId: recordDeployment
      summary: Record a successful preview deployment.
      description: |
        Best-effort callback after `vercel deploy --prebuilt` succeeds.
        The workflow uses `continue-on-error: true`, so 5XX responses
        won't fail the run — but the engine loses observability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentReport'
      responses:
        '202':
          description: Accepted (preferred).
        '200':
          description: Recorded.
        '401':
          description: Missing or invalid bearer token.
