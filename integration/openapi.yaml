openapi: 3.1.0
info:
  title: Evolution Engine ↔ micro-store-template contract
  version: 1.1.0
  description: |
    HTTP surface implemented by the Evolution Engine so the hourly storefront
    workflow can retrieve brand data and report a completed publication.

    The source of truth for `BrandData` is
    `schema/brand-data.schema.json`.
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: https://engine.example.com
        description: Value of the `EVOLUTION_ENGINE_URL` repository secret.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token stored as `EVOLUTION_ENGINE_TOKEN`.

  schemas:
    ColorPalette:
      type: object
      additionalProperties: false
      required: [primary, secondary]
      properties:
        primary:
          type: string
          pattern: '^#([0-9a-fA-F]{3}){1,2}$'
          example: "#0f172a"
        secondary:
          type: string
          pattern: '^#([0-9a-fA-F]{3}){1,2}$'
          example: "#f97316"

    BrandData:
      type: object
      additionalProperties: false
      required: [brandName, tagline, colorPalette]
      properties:
        brandName:
          type: string
          minLength: 1
          example: Driftwood Coffee
        tagline:
          type: string
          minLength: 1
          example: Brewed slow, poured bold.
        logoUrl:
          type: string
          pattern: '^https?://'
          example: https://cdn.example.com/logo.png
        heroImageUrl:
          type: string
          pattern: '^https?://'
          example: https://cdn.example.com/hero.png
        colorPalette:
          $ref: '#/components/schemas/ColorPalette'

    DeploymentReport:
      type: object
      additionalProperties: false
      required: [url, sha, run_id, ran_at]
      properties:
        url:
          type: string
          pattern: '^https://'
          description: Public URL emitted by the repository publishing workflow.
          example: https://full-stack-assets.github.io/micro-store-template/
        sha:
          type: string
          description: Commit SHA used for the build.
          example: a2053199ac9edcbf10493976e7e5752534143c7e
        run_id:
          type: string
          description: GitHub Actions run ID.
          example: "12345678901"
        ran_at:
          type: string
          format: date-time
          example: "2026-06-07T08:50:03Z"

security:
  - bearerAuth: []

paths:
  /brand:
    get:
      operationId: getBrand
      summary: Generate brand data for the next storefront build.
      description: |
        Called when a workflow run does not receive brand data from a manual
        input or repository dispatch payload.
      responses:
        '200':
          description: A `BrandData` payload conforming to the JSON schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandData'
        '401':
          description: Missing or invalid bearer token.
        '5XX':
          description: Engine-side failure.

  /deployments:
    post:
      operationId: recordDeployment
      summary: Record a successful storefront publication.
      description: |
        Best-effort callback after the repository publishing workflow returns
        a public URL. Callback failure does not invalidate the published site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentReport'
      responses:
        '202':
          description: Accepted.
        '200':
          description: Recorded.
        '401':
          description: Missing or invalid bearer token.
