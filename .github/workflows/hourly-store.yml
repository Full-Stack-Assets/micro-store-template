name: Hourly store generation

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      brand_data:
        description: "Override brand data JSON (skips engine fetch)"
        required: false
        type: string
  repository_dispatch:
    types: [engine-tick]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EVOLUTION_ENGINE_URL: ${{ secrets.EVOLUTION_ENGINE_URL }}
      EVOLUTION_ENGINE_TOKEN: ${{ secrets.EVOLUTION_ENGINE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Resolve brand data
        run: |
          set -euo pipefail
          manual_input='${{ github.event.inputs.brand_data || '' }}'
          dispatch_payload='${{ toJSON(github.event.client_payload.brand_data) }}'

          if [ -n "$manual_input" ]; then
            printf '%s' "$manual_input" > brand.json
          elif [ "${{ github.event_name }}" = "repository_dispatch" ] &&
               [ "$dispatch_payload" != "null" ] &&
               [ -n "$dispatch_payload" ]; then
            printf '%s' "$dispatch_payload" > brand.json
          elif [ -n "${EVOLUTION_ENGINE_URL:-}" ] &&
               [ -n "${EVOLUTION_ENGINE_TOKEN:-}" ]; then
            curl -fsSL \
              -H "Authorization: Bearer ${EVOLUTION_ENGINE_TOKEN}" \
              -H "Accept: application/json" \
              "${EVOLUTION_ENGINE_URL%/}/brand" \
              -o brand.json
          else
            echo "::error title=No brand source::Supply brand_data or configure both Evolution Engine secrets."
            exit 1
          fi

          {
            echo "NEXT_PUBLIC_BRAND_DATA<<BRAND_EOF"
            cat brand.json
            echo
            echo "BRAND_EOF"
          } >> "$GITHUB_ENV"

      - name: Validate brand data
        run: npx --no-install ajv validate -s schema/brand-data.schema.json -d brand.json

      - name: Build static export
        env:
          NEXT_PUBLIC_BRAND_DATA: ${{ env.NEXT_PUBLIC_BRAND_DATA }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Publish Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment to engine
        if: success() && env.EVOLUTION_ENGINE_URL != '' && env.EVOLUTION_ENGINE_TOKEN != ''
        continue-on-error: true
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${EVOLUTION_ENGINE_TOKEN}" \
            -H "Content-Type: application/json" \
            "${EVOLUTION_ENGINE_URL%/}/deployments" \
            -d "$(jq -n \
                    --arg url "${{ steps.deployment.outputs.page_url }}" \
                    --arg sha "${{ github.sha }}" \
                    --arg run_id "${{ github.run_id }}" \
                    '{url:$url, sha:$sha, run_id:$run_id, ran_at:now|todate}')"
